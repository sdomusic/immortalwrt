name: ImmortalWrt Build x86_64 Pure (v24.10.4)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # 释放磁盘空间（重点）
      - name: Expand Disk Space
        run: |
          echo "🔥 Expanding disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      # 拉取仓库
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 设置缓存
      - name: Setup CCache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-${{ hashFiles('build_config.sh') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-

      # 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncurses-dev libssl-dev \
            python3-pip python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget pkg-config bc u-boot-tools

      # 克隆 ImmortalWrt 官方源码
      - name: Clone ImmortalWrt v24.10.4
        run: git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b v24.10.4 immortalwrt

      # 更新并安装 feeds
      - name: Update and Install Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 清理环境
      - name: Clean Build Directory
        run: |
          cd immortalwrt
          make distclean || true

      # 写入最简 config（纯净原版）
      - name: Apply Minimal Config
        run: |
          cd immortalwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          EOF

      # 开始编译
      - name: Build Firmware
        run: |
          cd immortalwrt
          make defconfig
          make -j$(nproc) || make -j1 V=s

      # 生成校验值
      - name: Generate Checksums
        run: |
          cd immortalwrt/bin/targets
          find . -type f \( -name "*.img.gz" -o -name "*.bin" \) -exec sha256sum {} \; > sha256sums.txt
          cat sha256sums.txt

      # 上传编译产物（发布到 GitHub Release）
      - name: Upload Firmware and Checksums
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v24.10.4-${{ github.run_number }}"
          name: "ImmortalWrt v24.10.4 Build #${{ github.run_number }}"
          files: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.manifest
            immortalwrt/bin/targets/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 显示产物大小
      - name: Show Build Size
        run: du -h immortalwrt/bin/targets | sort -h | tail -n 10
