name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
      REPO_URL: https://github.com/immortalwrt/immortalwrt
      REPO_BRANCH: openwrt-23.05
      CONFIG_FILE: configs/my.config
      DIY_SCRIPT: scripts/diy.sh
      UCI_DEFAULTS_SCRIPT: scripts/expand_overlay.sh

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-pip rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Config & DIY
        run: |
          cd immortalwrt
          [ -f ../$DIY_SCRIPT ] && bash ../$DIY_SCRIPT || echo "No DIY script"
          [ -f ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
          make defconfig

      - name: Add Auto Expand Script (uci-defaults)
        run: |
          mkdir -p immortalwrt/package/base-files/files/etc/uci-defaults
          cat > immortalwrt/package/base-files/files/etc/uci-defaults/99-expand-overlay <<'EOF'
          #!/bin/sh
          # 自动扩容 overlay 到整盘空间
          ROOT_DISK=$(find /dev -maxdepth 1 -name "sd*" | grep -v "[0-9]$")
          if [ -n "$ROOT_DISK" ]; then
              PART=$(lsblk -lnpo NAME,TYPE "$ROOT_DISK" | awk '$2=="part"{print $1}' | tail -n1)
              resize2fs "$PART" >/dev/null 2>&1
          fi
          EOF
          chmod +x immortalwrt/package/base-files/files/etc/uci-defaults/99-expand-overlay

      - name: Start Build
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "immortalwrt-${{ github.run_number }}"
          name: "ImmortalWrt Build #${{ github.run_number }}"
          files: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Build Size
        run: du -h immortalwrt/bin/targets | sort -h | tail -n 10
        [ -f ../scripts/diy.sh ] && bash ../scripts/diy.sh || echo "No DIY script"

