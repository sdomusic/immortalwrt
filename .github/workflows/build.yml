name: ImmortalWrt Build x86_64 2048MB (v24.10.4)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup CCache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-${{ hashFiles('build_config.sh') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncurses-dev libssl-dev \
            python3-pip python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget pkg-config bc u-boot-tools

      - name: Clone ImmortalWrt v24.10.4
        run: git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b v24.10.4 immortalwrt

      - name: Update and Install Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clean Build Directory
        run: |
          cd immortalwrt
          make distclean || true

      - name: Make build_config.sh Executable
        run: chmod +x build_config.sh

      - name: Apply Custom Config
        run: ./build_config.sh

      - name: Build Firmware
        run: |
          cd immortalwrt
          make -j2 || make -j1 V=s

      - name: Generate Checksums
        run: |
          cd immortalwrt/bin/targets
          find . -type f \( -name "*.img.gz" -o -name "*.bin" \) -exec sha256sum {} \; > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Firmware and Checksums
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v24.10.4-${{ github.run_number }}"
          name: "ImmortalWrt v24.10.4 Build #${{ github.run_number }}"
          files: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.manifest
            immortalwrt/bin/targets/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Build Size
        run: du -h immortalwrt/bin/targets | sort -h | tail -n 10
