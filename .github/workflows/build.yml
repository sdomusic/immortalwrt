name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-pip rsync unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-23.05 immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply DIY Script
        run: |
          cd immortalwrt
          if [ -f ../scripts/diy.sh ]; then
            bash ../scripts/diy.sh
          else
            echo "No DIY script found"
          fi

      - name: Apply Custom Config
        run: |
          cd immortalwrt
          if [ -f ../configs/my.config ]; then
            cp ../configs/my.config .config
          else
            echo "No custom config found"
          fi
          make defconfig

      - name: Add Auto Expand Overlay Script
        run: |
          cd immortalwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-expand-overlay <<'EOF'
#!/bin/sh
ROOT_DISK=$(find /dev -maxdepth 1 -name "sd*" | grep -v "[0-9]$")
if [ -n "$ROOT_DISK" ]; then
    PART=$(lsblk -lnpo NAME,TYPE "$ROOT_DISK" | awk '$2=="part"{print $1}' | tail -n1)
    resize2fs "$PART" >/dev/null 2>&1
fi
EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-expand-overlay

      - name: Build Firmware
        run: |
          cd immortalwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "immortalwrt-${{ github.run_number }}"
          name: "ImmortalWrt Build #${{ github.run_number }}"
          files: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Build Size
        run: du -h immortalwrt/bin/targets | sort -h | tail -n 10
