name: ImmortalWrt Build x86_64 2048MB Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2️⃣ 设置 ccache 缓存
      - name: Setup CCache
        uses: actions/cache@v3
        with:
          path: .ccache
          key: ${{ runner.os }}-immortalwrt-ccache-${{ hashFiles('configs/my.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ccache-

      # 3️⃣ 安装 Ubuntu 22.04 兼容依赖
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncurses-dev libssl-dev \
            python3-pip python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget pkg-config bc u-boot-tools

      # 4️⃣ 克隆 ImmortalWrt 源码
      - name: Clone ImmortalWrt Source
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-23.05 immortalwrt

      # 5️⃣ 更新并安装 feeds
      - name: Update and Install Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 6️⃣ 清理旧构建文件
      - name: Clean Build Directory
        run: |
          cd immortalwrt
          make distclean || true

      # 7️⃣ 应用自定义配置（固定 2048MB 根分区）
      - name: Apply Custom Config
        run: |
          cd immortalwrt
          if [ -f ../configs/my.config ]; then
            cp ../configs/my.config .config
          else
            echo "No custom config found, using default minimal config"
            CONFIG_FILE=".config"
            echo "CONFIG_TARGET_x86=y" > $CONFIG_FILE
            echo "CONFIG_TARGET_x86_64=y" >> $CONFIG_FILE
            echo "CONFIG_TARGET_x86_64_Generic=y" >> $CONFIG_FILE
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-app-firewall=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-app-opkg=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_htop=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_curl=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_wget=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_block-mount=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-app-openclash=y" >> $CONFIG_FILE
            echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y" >> $CONFIG_FILE
          fi
          make defconfig

      # 8️⃣ 编译固件（限制并行数，避免 OOM）
      - name: Build Firmware
        run: |
          cd immortalwrt
          make -j2 || make -j1 V=s

      # 9️⃣ 生成 SHA256 校验文件
      - name: Generate Checksums
        run: |
          cd immortalwrt/bin/targets
          find . -type f \( -name "*.img.gz" -o -name "*.bin" \) -exec sha256sum {} \; > sha256sums.txt
          cat sha256sums.txt

      # 🔟 上传 Release（固件 + 校验文件）
      - name: Upload Firmware and Checksums
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "immortalwrt-${{ github.run_number }}"
          name: "ImmortalWrt Build #${{ github.run_number }}"
          files: |
            immortalwrt/bin/targets/**/*.img.gz
            immortalwrt/bin/targets/**/*.bin
            immortalwrt/bin/targets/**/*.manifest
            immortalwrt/bin/targets/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11️⃣ 查看编译产物大小
      - name: Show Build Size
        run: du -h immortalwrt/bin/targets | sort -h | tail -n 10
